<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
    <radialGradient id="ball-dark" cx="38%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <radialGradient id="ball-center" cx="38%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#bbb"/>
    </radialGradient>
  </defs>
  <!-- Rods -->
  <line x1="24" y1="24" x2="12" y2="8" stroke="#333" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="40" y2="10" stroke="#333" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="8" y2="32" stroke="#333" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="30" y2="42" stroke="#555" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Outer balls -->
  <circle cx="12" cy="8" r="5.5" fill="url(#ball-dark)"/>
  <circle cx="40" cy="10" r="5.5" fill="url(#ball-dark)"/>
  <circle cx="8" cy="32" r="5.5" fill="url(#ball-dark)"/>
  <circle cx="30" cy="42" r="5.5" fill="url(#ball-dark)" opacity="0.7"/>
  <!-- Center ball -->
  <circle cx="24" cy="24" r="6.5" fill="url(#ball-center)" stroke="#333" stroke-width="1.2"/>
</svg>
