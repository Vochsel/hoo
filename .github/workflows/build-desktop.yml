name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare electron-builder package-manager detection
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); delete pkg.packageManager; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          rm -f bun.lock bun.lockb

      - name: Validate icon assets
        run: |
          test -f build/icon.icns
          test -f build/icon.ico
          test -f build/icon.png

      - name: Build macOS artifacts
        run: npm run build && npx electron-builder --mac --arm64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoo-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
          if-no-files-found: error

  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate icon assets
        shell: pwsh
        run: |
          if (!(Test-Path "build/icon.icns")) { throw "Missing build/icon.icns" }
          if (!(Test-Path "build/icon.ico")) { throw "Missing build/icon.ico" }
          if (!(Test-Path "build/icon.png")) { throw "Missing build/icon.png" }

      - name: Build Windows artifacts
        run: bun run dist:win:x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoo-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
          if-no-files-found: error
